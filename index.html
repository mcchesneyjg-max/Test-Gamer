<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Test OK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Block Pickup</h1>
      <p class="hint">Move with <kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd> · Jump with <kbd>Space</kbd> · Pick up / drop with <kbd>E</kbd></p>
    </header>
    <canvas id="game" width="800" height="450"></canvas>
    <p id="status" class="status">Walk to a block and press E to pick it up.</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
